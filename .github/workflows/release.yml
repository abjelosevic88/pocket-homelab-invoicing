name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chromium variant
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chromium
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=${{ env.IMAGE }}:${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-chromium,${{ env.IMAGE }}:latest-chromium
  binaries:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", GOARM: "${{ matrix.goarm }}", CGO_ENABLED: "0" }
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="pocket-invoicing_${{ github.ref_name }}_${GOOS}_${GOARCH}${GOARM:+v$GOARM}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "dist/$name/pocket-invoicing$ext" ./cmd/pocket-invoicing
          cp README.md LICENSE .env.example "dist/$name/"
          cd dist && tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
